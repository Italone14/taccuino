    if (balances().some(a => a.name.toLowerCase() === name.toLowerCase())) return $('sErr').textContent = 'Esiste già un conto con questo nome.';
    if (!isFinite(v2)) return $('sErr').textContent = 'Il saldo deve essere un numero, per esempio 120,50 o -30.';
    const acc = { ...(CONF.acc || {}) }; acc[name] = { v: Math.round(v2 * 100) / 100, ts: Date.now() };
    try { await saveConf({ extraAcc: [...(CONF.extraAcc || []), name], acc }); toast('Conto aggiunto'); SET = { view: 'accs' }; drawSettings(); } catch (e) { $('sErr').textContent = 'Non sono riuscito a salvare: riprova.'; }
  };
}

async function maybeImport(d) {
  try { const s = await d.collection('storico').limit(1).get(); if (!s.empty) return; } catch (e) { return; }
  return new Promise(resolve => {
    const el = $('login'); el.hidden = false;
    el.innerHTML = `<div class="lg-box"><div class="lg-ic">📦</div><h1>Porta i tuoi dati</h1><p>È la prima volta che accedi. Scegli il file <b>taccuino-dati.json</b> che hai ricevuto: dentro c'è tutto lo storico, le spese, i saldi e le impostazioni.</p>
      <label class="btn pri lg-file">Scegli il file<input id="impF" type="file" accept=".json,application/json" hidden></label>
      <div class="err" id="impErr"></div><button type="button" class="linkbtn" id="impSkip">Parti da zero</button></div>`;
    $('impSkip').onclick = () => { el.hidden = true; resolve(); };
    $('impF').onchange = async () => { const f = $('impF').files[0]; if (!f) return; $('impErr').textContent = 'Importo…';
      try { const n = await importData(d, JSON.parse(await f.text())); el.hidden = true; toast(`Importati ${n} documenti`); resolve(); } catch (e) { $('impErr').textContent = e && e.code === 'permission-denied' ? 'Permesso negato: su Firebase le regole di sicurezza non sono ancora pubblicate.' : 'Non riuscito: ' + ((e && (e.code || e.message)) || 'errore'); } };
  });
}
async function importData(d, obj) {
  const ops = []; for (const c of ['storico', 'tx', 'config']) for (const [id, data] of Object.entries(obj[c] || {})) ops.push([c, id, data]);
  for (let i = 0; i < ops.length; i += 400) { const b = d.batch(); ops.slice(i, i + 400).forEach(([c, id, data]) => b.set(d.doc(c + '/' + id), data)); await b.commit(); }
  return ops.length;
}
async function exportData() {
  const out = { v: 1, storico: {}, tx: {}, config: {} };
  for (const c of ['storico', 'tx', 'config']) { const s = await db.collection(c).get(); s.docs.forEach(x => out[c][x.id] = x.data()); }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: 'application/json' })); a.download = `taccuino-backup-${iso(new Date())}.json`; a.click();
}

/* ---------- copia locale dei dati: l'app si apre subito con gli ultimi dati visti ---------- */
const CKEY = 'tac-cache-v1'; let CACHED = null;
function loadCache() { if (window.claude) return false; try { const c = JSON.parse(localStorage.getItem(CKEY) || 'null'); if (!c || !c.HIST) return false; HIST = c.HIST; NEWS = c.NEWS || []; CONF = c.CONF || {}; window.CONF = CONF; CACHED = c.uid || null; return true; } catch (e) { return false; } }
function saveCache() { if (window.claude) return; clearTimeout(saveCache.t); saveCache.t = setTimeout(() => { if (!(ready.h && ready.n && ready.c)) return; try { localStorage.setItem(CKEY, JSON.stringify({ uid: FBUSER ? FBUSER.uid : null, at: Date.now(), HIST, NEWS, CONF })); } catch (e) {} }, 800); }
function dropCache() { try { localStorage.removeItem(CKEY); } catch (e) {} }
/* ---------- feedback al tocco su tutti i pulsanti ---------- */
document.addEventListener('pointerdown', ev => { const b = ev.target.closest && ev.target.closest('button,[role="button"],a,.tab,.fab,label.btn'); if (!b || b.classList.contains('k') || b.disabled) return; b.classList.add('tap'); const off = () => { setTimeout(() => b.classList.remove('tap'), 90); ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.removeEventListener(t, off)); }; ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.addEventListener(t, off)); }, { passive: true });
document.addEventListener('touchstart', () => {}, { passive: true });
const HAD_CACHE = loadCache();
render();
(async () => {
  if (window.claude && window.claude.use) { try { db = await window.claude.use('db'); } catch (e) { db = null; } if (db) document.title = 'Taccuino · anteprima'; }
  if (!db) { if (typeof firebase === 'undefined') { $('status').textContent = 'Connessione assente: riapri l\'app.'; return; } db = await fbLogin(); }
  if (!db) return;
  if (CACHED && FBUSER && CACHED !== FBUSER.uid) { HIST = {}; NEWS = []; CONF = {}; dropCache(); }
  const done = k => { ready[k] = true; const all = ready.h && ready.n && ready.c; if (all) { $('status').textContent = ''; genRecurring(); saveCache(); } if (all || HAD_CACHE) render(); };
  const fail = e => { const m = e && e.code === 'permission-denied' ? 'Permesso negato: pubblica le regole di sicurezza su Firebase (Firestore → Regole).' : 'Dati non raggiungibili: riapri l\'app.'; $('status').textContent = m; toast(m); };
  subscribeAll = () => {
    UNSUB.forEach(u => { try { u(); } catch (e) {} }); UNSUB = [];
    const meta = (k, s) => { SYNC[k] = { at: Date.now(), cache: !!(s.metadata && s.metadata.fromCache), pending: !!(s.metadata && s.metadata.hasPendingWrites) }; SYNC.err = null; if (!$('set').hidden && SET.view === 'sync') drawSettings(); };
    const failS = e => { SYNC.err = e && e.code || 'unavailable'; fail(e); if (!$('set').hidden) drawSettings(); };
    UNSUB.push(db.doc('config/app').onSnapshot(s => { CONF = s.exists ? { ...s.data() } : {}; window.CONF = CONF; if (CONF.ui) { try { if (CONF.ui.theme) localStorage.setItem('tac-theme', CONF.ui.theme); if (CONF.ui.style) localStorage.setItem('tac-style', CONF.ui.style); if (CONF.ui.bx) localStorage.setItem('tac-bx', CONF.ui.bx); if (CONF.ui.rows) localStorage.setItem('tac-rows', CONF.ui.rows); if ('hide' in CONF.ui) localStorage.setItem('tac-hide', CONF.ui.hide ? '1' : '0'); } catch (e) {} applyTheme(); applyStyle(); setRows(rowPref()); document.documentElement.style.setProperty('--bx', bxPref() + 'px'); } Object.entries(ACC_REN).forEach(([o, n]) => { if (CONF.acc && CONF.acc[o] && !CONF.acc[n]) { CONF.acc = { ...CONF.acc, [n]: CONF.acc[o] }; } if (CONF.accOrder) CONF.accOrder = CONF.accOrder.map(x => x === o ? n : x); if (CONF.extraAcc) CONF.extraAcc = CONF.extraAcc.map(x => x === o ? n : x); }); meta('c', s); done('c'); }, failS));
    UNSUB.push(db.collection('storico').limit(200).onSnapshot(s => { HIST = {}; s.docs.forEach(d => { const x = d.data(); (x.tx || []).forEach(renAcc); HIST[d.id] = x; }); meta('h', s); done('h'); }, failS));
    UNSUB.push(db.collection('tx').limit(1000).onSnapshot(s => { NEWS = s.docs.map(d => renAcc({ id: d.id, ...d.data() })).filter(e => typeof e.v === 'number' && e.d); meta('n', s); done('n'); }, failS));
  };
  subscribeAll();
})();
