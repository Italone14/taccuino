<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Taccuino</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Taccuino">
<meta name="theme-color" content="#f7f5f1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Lora:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#1c1c1d;--bg-2:#232325;--card:#262628;--ink:#f3f1ec;--ink-2:#c9c6bf;--muted:#8d8a84;--dash:rgba(255,255,255,.2);
  --pink:#ee6aa0;--pink-soft:rgba(238,106,160,.16);--good:#5cc98a;--bad:#ef7a6b;--warn:#e9b44c;
  --hl-blue:rgba(92,116,170,.55);--hl-green:rgba(64,140,86,.6);--hl-red:rgba(170,60,55,.6);--hl-rose:rgba(150,52,70,.6);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --serif:"Playfair Display","Didot","Bodoni 72",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:0 calc(150px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:3px 3px}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* barra superiore */
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-block:14px 4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.mnav{display:flex;align-items:center;justify-content:center;gap:14px}
.mnav b{font-weight:800;letter-spacing:.2em;font-size:15px;text-transform:uppercase;white-space:nowrap}
.mnav .ptitle{border:0;background:none;color:var(--ink);font-weight:800;letter-spacing:.2em;font-size:15px;text-transform:uppercase;white-space:nowrap;cursor:pointer;padding:6px 2px;display:inline-flex;align-items:center;gap:8px}
.mnav .ptitle.long{letter-spacing:.03em;font-size:13px}
.mnav{min-width:0}.mnav .ib{width:32px}
.mnav .ptitle i{width:16px;height:16px;border-radius:50%;background:var(--pink);display:inline-grid;place-items:center;font-style:normal;font-size:10px;color:#1c1c1d}
.mnav .ptitle i::before{content:"▾"}
.fsec{font-weight:800;letter-spacing:.16em;font-size:14px;text-transform:uppercase;margin:22px 0 10px}
.fchips{display:flex;flex-wrap:wrap;gap:10px}
.fchips .chip{font-size:16px;padding:10px 18px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;font-size:17px}
.frow input{width:84px;text-align:center;font:inherit;font-size:18px;background:none;border:1.5px solid var(--ink);border-radius:10px;padding:8px;color:var(--ink)}
.savetop{display:flex;justify-content:flex-end}
.savetop button{border:0;background:none;font-weight:700;font-size:17px;cursor:pointer;padding:6px 2px;color:var(--ink)}
.ib{border:0;background:none;color:var(--ink);width:40px;height:40px;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.25}
.title-caps{font-weight:800;letter-spacing:.2em;font-size:15px;text-align:center}

/* titoli calligrafici */
.script{font-family:var(--script);font-weight:400;font-size:46px;line-height:1.1;margin:22px 0 8px;letter-spacing:0}
.hl{display:inline-block;position:relative;font-weight:600;letter-spacing:.04em;font-size:13px;text-transform:uppercase;padding:0 4px;z-index:0}
.hl::before{content:"";position:absolute;inset:4px -2px 1px;border-radius:2px 6px 3px 5px;z-index:-1;transform:rotate(-1deg)}
.hl.blue::before{background:var(--hl-blue)}.hl.green::before{background:var(--hl-green)}.hl.red::before{background:var(--hl-red)}.hl.rose::before{background:var(--hl-rose)}

/* riepilogo */
.summary{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:6px}
.summary>div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px}
.summary>div+div{border-left:1.5px dashed var(--dash)}
.summary .v{font-size:clamp(15px,4.6vw,22px);font-weight:600;white-space:nowrap}

/* card budget */
.bcard{margin-top:22px;border:1.5px dashed var(--dash);border-radius:18px;padding:16px 18px;cursor:pointer;background:none;width:100%;text-align:left;display:block}
.bcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bcard .big{font-family:var(--serif);font-style:italic;font-size:32px;font-weight:600}
.bcard small{color:var(--muted);font-size:13px}
.track{height:8px;border-radius:4px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;margin-top:10px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.track .tk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.good{background:rgba(92,201,138,.15);color:var(--good)}.pill.bad{background:rgba(239,122,107,.15);color:var(--bad)}.pill.warn{background:rgba(233,180,76,.15);color:var(--warn)}

/* liste categorie */
.clist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 0;border:0;background:none;text-align:left;cursor:pointer;width:100%;position:relative}
.crow::after{content:"";position:absolute;left:24px;right:16px;bottom:0;border-bottom:1.5px dashed var(--dash)}
.crow:last-child::after{display:none}
.crow .nm{font-size:18px}
.crow .amt{font-size:18px;font-variant-numeric:tabular-nums;padding-right:2px}
.crow .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ico svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:34px;height:34px}.ico.sm svg{width:18px;height:18px}
.ico .ltr{font-weight:800;color:#fff;font-size:16px}
.empty{color:var(--muted);padding:14px 0;font-size:15px}

/* transazioni */
.search{display:flex;gap:8px;margin:8px 0 2px}
.search input{flex:1;font:inherit;font-size:16px;background:var(--bg-2);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{border:0;background:var(--bg-2);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:#4a1f2a;color:#fff}
.chip.x::after{content:" ✕";opacity:.7}
.day{display:flex;align-items:center;gap:12px;margin:26px 0 4px}
.blob{position:relative;width:66px;height:66px;flex:none;margin-left:-8px}
.blob svg{position:absolute;inset:0;width:100%;height:100%}
.blob b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-weight:500;font-size:28px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.day .wd{font-family:var(--script);font-size:36px}
.tx{display:grid;grid-template-columns:44px 1fr auto;gap:4px 14px;align-items:center;padding:13px 0;border:0;background:none;text-align:left;width:100%;cursor:pointer;position:relative}
.tx::after{content:"";position:absolute;left:24px;right:16px;bottom:0;border-bottom:1.5px dashed var(--dash)}
.tx .nm{font-size:18px}.tx .ac{display:block;font-size:15px;color:var(--muted)}
.tx .amt{font-size:18px;font-variant-numeric:tabular-nums}
.tx .amt.in{color:var(--good)}
.tx .note{grid-column:1/-1;font-size:15px;color:var(--ink-2);padding-left:2px}

/* conti */
.nw{text-align:center;margin-top:26px}
.nw .big{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(42px,12vw,58px);margin-top:12px;white-space:nowrap}
.acc{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border:1.5px dashed var(--dash);border-radius:18px;padding:18px 20px;margin-top:14px;background:none;width:100%;text-align:left;cursor:pointer}
.acc .nm{font-size:19px}.acc .amt{font-size:18px;font-variant-numeric:tabular-nums}
.acc .warn{display:block;font-size:12px;color:var(--warn)}

/* approfondimenti */
.panel{border:1.5px dashed var(--dash);border-radius:18px;padding:16px 16px;margin-top:6px}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.brow:last-child{border-bottom:0}
.brow .nm{font-size:15.5px}.brow .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.brow .r small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.brow .track{grid-column:1/-1;margin-top:4px;height:6px}
.brow.over .r{color:var(--bad)}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 6px}
.chart text{font-family:var(--sans);font-size:10.5px;fill:var(--muted)}
.chart svg{display:block;width:100%;overflow:visible}
.linkbtn{border:0;background:none;color:var(--pink);font-weight:700;cursor:pointer;padding:6px 0;font-size:15px}
table.cmp{width:100%;border-collapse:collapse;font-size:14.5px}
table.cmp th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;font-weight:700}
table.cmp td{padding:7px 4px;text-align:right;border-top:1px dashed rgba(255,255,255,.1);font-variant-numeric:tabular-nums}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
.up{color:var(--bad)}.down{color:var(--good)}
.tip{position:fixed;pointer-events:none;background:#333336;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:7px 10px;font-size:13px;z-index:60;opacity:0;transition:opacity .08s;white-space:nowrap}
.tip.on{opacity:1}

/* tab bar e fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(36,36,38,.97);border-top:1px solid rgba(255,255,255,.06);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12.5px;cursor:pointer;padding:4px 0}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--pink)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(82px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:38px;font-weight:300;line-height:1;cursor:pointer;z-index:21;box-shadow:0 6px 20px rgba(238,106,160,.35);display:grid;place-items:center}

/* foglio inserimento */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#202022;border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;max-height:92%;overflow-y:auto;border-top:1px solid rgba(255,255,255,.08)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:#4a1f2a;color:#fff}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:18px 0 8px}
.amount input{font-family:var(--serif);font-style:italic;font-weight:600;font-size:46px;background:none;border:0;color:var(--ink);text-align:right;width:6ch;padding:0}
.amount span{font-family:var(--serif);font-style:italic;font-size:34px;color:var(--muted)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;margin-top:10px}
.cat{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);cursor:pointer;padding:6px 2px;border-radius:12px;text-align:center;line-height:1.15}
.cat[aria-pressed="true"]{background:var(--pink-soft);color:#fff}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fld label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fld input,.fld select{font:inherit;font-size:16px;background:var(--bg-2);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:11px 12px;color:var(--ink);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;cursor:pointer;font-size:16px}
.btn.pri{background:var(--pink);color:#fff}.btn.sec{background:var(--bg-2)}.btn.del{background:rgba(239,122,107,.15);color:var(--bad);flex:0 0 auto;padding:14px 18px}
.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:14px;min-height:1em;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:#3a3a3d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:70;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.status{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* approfondimenti: stile report */
body.light{--bg:#f4f4f0;--ink:#15191c;--ink-2:#4c524f;--muted:#858a82;--dash:rgba(0,0,0,.15);background:#f4f4f0;background-image:none;color:#15191c}
body.light .topbar{background:#f4f4f0}
body.light .sheet{--ink:#f3f1ec;--ink-2:#c9c6bf;--muted:#8d8a84;color:#f3f1ec}
body.light .ib{color:#15191c}
body.light .tabbar{background:rgba(250,250,247,.97);border-top-color:rgba(0,0,0,.08)}
body.light .tab{color:#858a82}
body.light .tip{background:#fff;color:#15191c;border-color:rgba(0,0,0,.12);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.rp{font-family:"Figtree",var(--sans);color:#15191c;padding-top:6px}
.r-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#858a82;font-weight:700}
.r-h1{font-family:"Lora",Georgia,serif;font-weight:600;font-size:27px;line-height:1.15;margin:6px 0 0;letter-spacing:-.01em}
.r-kpis{display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid #15191c;border-bottom:1px solid #e4e5df;margin:16px 0 4px}
.r-kpis>div{padding:10px 10px 11px 0;display:flex;flex-direction:column;gap:2px}
.r-kpis>div:nth-child(even){padding-left:12px;border-left:1px solid #e4e5df}
.r-kpis>div:nth-child(n+3){border-top:1px solid #e4e5df}
.r-kpis span{font-size:12px;font-weight:700;color:#4c524f}.r-kpis b{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}.r-kpis small{font-size:12px;color:#858a82}
.r-card{border-top:1.5px solid #15191c;margin-top:26px;padding-top:10px}
.r-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.r-head h2{font-family:"Lora",Georgia,serif;font-weight:600;font-size:19px;margin:0}
.r-head span{font-size:12.5px;color:#858a82}
.r-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.r-tbl th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#858a82;font-weight:700;text-align:right;padding:6px 4px;border-bottom:1.5px solid #15191c}
.r-tbl td{padding:6px 4px;text-align:right;border-bottom:1px solid #e9eae4;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-tbl th:first-child,.r-tbl td:first-child{text-align:left;white-space:normal}
.r-tbl td small{color:#858a82;font-size:11.5px}
.r-tbl .w{width:34%}
.r-dim{display:block;color:#858a82;font-size:11.5px;font-variant-numeric:tabular-nums}.r-dim2{color:#858a82;font-size:12px}
.rp{overflow-x:hidden}.r-tbl tr.tot td{font-weight:700;border-bottom:0}
.r-bar{display:block;position:relative;height:8px;border-radius:2px;background:#ecede8}
.r-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.r-bar em{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:#15191c}
.neg{color:#c2412f;font-weight:700}.pos{color:#1f7a4d;font-weight:700}
.r-ok{color:#1f7a4d;font-weight:700;font-size:12px}.r-part{color:#9a6a00;font-weight:700;font-size:12px}.r-no{color:#858a82;font-size:12px}
.r-sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#858a82;font-weight:700;margin:16px 0 2px}
.r-note{font-size:13px;color:#4c524f;margin:8px 0 0;line-height:1.5}
.r-anchor{color:#2a78d6;font-weight:700;text-decoration:none;border:0;background:none;padding:0;font:inherit;cursor:pointer}
.r-tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#e9e9e3;border-radius:12px;padding:4px;margin:14px 0 4px;box-shadow:0 6px 10px -8px rgba(0,0,0,.25)}
.r-tabs button{border:0;background:none;border-radius:9px;padding:9px 4px;font:inherit;font-weight:700;font-size:14px;color:#4c524f;cursor:pointer}
.r-tabs button[aria-selected="true"]{background:#fff;color:#15191c;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.rp .r-kpis{margin-top:10px}
.r-sub-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.r-sub-tabs button{border:1px solid #d8d9d2;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:13.5px;font-weight:600;color:#4c524f;cursor:pointer}
.r-sub-tabs button[aria-pressed="true"]{background:#15191c;border-color:#15191c;color:#fff}
.r-link{border:0;background:none;color:#2a78d6;font-weight:700;cursor:pointer;padding:10px 0 0;font-size:14px}
.r-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.r-chip{border:1px solid #d8d9d2;background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:#15191c}
.r-chip[aria-pressed="true"]{background:#15191c;color:#fff;border-color:#15191c}
.rchart svg{display:block;width:100%}
.rchart text{font-family:"Figtree",var(--sans);font-size:10.5px;fill:#858a82}
.rchart text.vl{fill:#15191c;font-weight:700}

/* nuova transazione a schermo intero */
.txe{position:fixed;inset:0;z-index:50;background:var(--bg);background-image:radial-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:3px 3px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.xinner{flex:1;overflow-y:auto;padding:0 18px;max-width:560px;width:100%;margin:0 auto}
.xtop{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:12px 0 6px}
.xtop b{text-align:center;font-weight:800;letter-spacing:.18em;font-size:15px;text-transform:uppercase}
.xtop .ib svg{width:26px;height:26px}
.types{display:flex;justify-content:space-between;gap:2px;margin-top:16px;flex-wrap:nowrap}
.ty{border:1.5px solid transparent;background:none;border-radius:999px;padding:7px 9px;display:inline-flex;align-items:center;gap:6px;font-weight:800;letter-spacing:.07em;font-size:12px;white-space:nowrap;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.ty svg{width:19px;height:19px;flex:none;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ty[aria-pressed="true"]{border-color:#c24a43}
.bigamt{text-align:center;font-size:clamp(46px,14vw,58px);font-weight:600;margin:26px 0 18px;letter-spacing:-.01em}
.xrows{display:flex;flex-direction:column}
.xrow{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0;border:0;border-bottom:1px solid rgba(255,255,255,.1);background:none;font-size:19px;cursor:pointer;text-align:left;width:100%}
.xrow .xv{display:inline-flex;align-items:center;gap:10px;color:var(--ink);font-size:17px;min-width:0}
.xrow .xv svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:2;flex:none}
.xrow .xv .ico svg{stroke:#fff;width:16px;height:16px}
.xrow .scegli{color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px}
.xdate{position:absolute;inset:0;opacity:.011;color:transparent;width:100%;height:100%;border:0;cursor:pointer;font-size:16px}
.xrows textarea{font:inherit;font-size:19px;background:none;border:0;color:var(--ink);padding:18px 0;resize:none;outline:none}
.xrows textarea::placeholder{color:var(--muted)}
.xdel{border:0;background:rgba(239,122,107,.12);color:var(--bad);border-radius:14px;padding:13px;font-weight:700;margin-top:6px;cursor:pointer}
.keypad{background:#171718;border-radius:26px 26px 0 0;padding:10px 8px calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:560px;width:100%;margin:0 auto}
.k{border:0;background:#3a3a3c;border-radius:10px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.k b{font-size:26px;font-weight:400;line-height:1}.k small{font-size:10px;letter-spacing:.2em;font-weight:700;margin-top:2px}
.k:active{background:#5a5a5e}
.k.kb{background:none}.k.kb svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linejoin:round}
.plist{display:flex;flex-direction:column;margin-top:6px}
.srow{display:grid;grid-template-columns:14px 1fr 20px;gap:14px;align-items:center;padding:18px 2px;border:0;border-bottom:1px dashed rgba(255,255,255,.14);background:none;text-align:left;cursor:pointer;width:100%}
.srow b{display:block;font-size:18px;font-weight:600}.srow small{color:var(--muted);font-size:14px}
.srow svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:2}
.sdot{width:12px;height:12px;border-radius:50%;display:inline-block}.sdot.lg{width:18px;height:18px;flex:none;margin-top:4px}
.sbig{display:flex;gap:14px;align-items:flex-start;border:1.5px dashed var(--dash);border-radius:18px;padding:16px;margin:10px 0 12px}
.sbig b{font-size:19px}.sbig p{margin:4px 0 0;color:var(--ink-2);font-size:14.5px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px dashed rgba(255,255,255,.1);font-size:15.5px}.kv span{color:var(--ink-2)}
.pitem:disabled{cursor:default;opacity:1}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.ichoice{height:46px;border-radius:12px;border:0;background:var(--bg-2);display:grid;place-items:center;cursor:pointer}
.ichoice svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ichoice[aria-pressed="true"]{background:var(--pink)}
.cgrid{display:flex;flex-wrap:wrap;gap:10px}
.cchoice{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.cchoice[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--pink)}
.psearch{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:#2a2a2c;border-radius:12px;padding:0 12px;margin:8px 0 4px}
.psearch svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.psearch input{flex:1;font:inherit;font-size:17px;background:none;border:0;color:var(--ink);padding:11px 0;outline:none}
.pitem{display:flex;align-items:center;gap:14px;padding:14px 4px;border:0;border-bottom:1px dashed rgba(255,255,255,.12);background:none;font-size:18px;cursor:pointer;text-align:left;width:100%}
.pitem .pv{margin-left:auto;color:var(--muted);font-size:15px}
.pitem[aria-pressed="true"]{color:var(--pink)}
@media (max-height:700px){.bigamt{margin:14px 0 8px}.xrow{padding:14px 0}.k{height:46px}}

/* ================= stile moderno (prova) ================= */
:root{color-scheme:light;
  --bg:#f3f3f0;--bg-2:#e8e8e3;--card:#ffffff;--ink:#121417;--ink-2:#4a4f57;--muted:#878c95;--dash:rgba(18,20,23,.08);
  --pink:#f25f3a;--pink-soft:rgba(242,95,58,.14);--good:#1d9a5b;--bad:#dd4433;--warn:#c98a00;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--serif:var(--sans);--script:var(--sans);
  --hl-blue:#5b9bef;--hl-green:#3fbf74;--hl-red:#f25f3a;--hl-rose:#f25f3a;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.12)}
html,body{background:var(--bg)}
body{font-family:var(--sans);background-image:none;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.topbar{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mnav .ptitle{letter-spacing:-.01em;font-size:17px;font-weight:700;text-transform:none}
.mnav .ptitle::first-letter{text-transform:uppercase}
.mnav .ptitle.long{letter-spacing:-.01em;font-size:15px}
.mnav .ptitle i{background:var(--pink);color:#fff}
.title-caps{letter-spacing:-.01em;font-size:17px;text-transform:none}
.ib{color:var(--ink)}
.script{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 2px 10px}
.hl{font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);padding:0;display:inline-flex;align-items:center;gap:6px}
.hl::before{position:static;inset:auto;width:8px;height:8px;border-radius:50%;transform:none;display:inline-block}
.hl.blue::before{background:#5b9bef}.hl.green::before{background:var(--good)}.hl.red::before{background:var(--pink)}.hl.rose::before{background:var(--pink)}
.summary{gap:8px;margin-top:4px}
.summary>div{background:var(--card);border-radius:18px;padding:14px 12px;align-items:flex-start;text-align:left;box-shadow:var(--shadow)}
.summary>div+div{border-left:0}
.summary .v{font-size:clamp(15px,4.4vw,19px);font-weight:700;letter-spacing:-.02em}
.bcard{border:0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-top:10px}
.m-bcard{display:flex;align-items:center;gap:16px;padding:16px}
.m-ring{width:88px;height:88px;flex:none}
.m-bmain{display:flex;flex-direction:column;gap:3px;min-width:0}
.m-lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.bcard .big{font-family:var(--sans);font-style:normal;font-weight:700;font-size:30px;letter-spacing:-.03em;line-height:1.1}
.bcard small{font-size:12.5px}
.m-brow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill.neutral{background:var(--bg-2);color:var(--ink-2)}
.clist{background:var(--card);border-radius:20px;padding:2px 14px;box-shadow:var(--shadow)}
.crow{padding:12px 0;grid-template-columns:40px 1fr auto;gap:12px}
.crow::after{left:52px;right:0;border-bottom:1px solid var(--dash)}
.crow .nm,.tx .nm{font-size:16px;font-weight:500}
.crow .amt,.tx .amt{font-size:16px;font-weight:600;letter-spacing:-.01em}
.ico{border-radius:12px;width:38px;height:38px}
.ico.sm{border-radius:10px}
.empty{padding:14px 2px}
.chip{background:var(--card);border:1px solid var(--dash);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search input,.fld input,.fld select{background:var(--card);border-color:var(--dash)}
.m-day{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:10px;margin:22px 2px 8px}
.m-dnum{font-size:28px;font-weight:700;letter-spacing:-.04em;line-height:1}
.m-dwd{font-size:14px;font-weight:600;text-transform:capitalize}.m-dwd small{display:block;font-size:12px;font-weight:500;color:var(--muted);text-transform:none}
.m-dtot{font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}.m-dtot.in{color:var(--good)}
.m-group{background:var(--card);border-radius:20px;padding:2px 14px;box-shadow:var(--shadow)}
.tx{padding:12px 0;grid-template-columns:40px 1fr auto;gap:3px 12px}
.tx::after{left:52px;right:0;border-bottom:1px solid var(--dash)}
.tx:last-child::after{display:none}
.tx .ac{font-size:13px}
.tx .note{grid-column:2/-1;font-size:13.5px;color:var(--ink-2);padding:0}
.nw{background:var(--card);border-radius:24px;padding:22px 20px;margin-top:14px;text-align:left;box-shadow:var(--shadow)}
.nw .big{font-family:var(--sans);font-style:normal;font-weight:700;letter-spacing:-.04em;font-size:clamp(36px,10vw,46px);margin-top:6px}
.m-split{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:10px}
.m-split i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.m-bar{height:8px;border-radius:4px;background:#5b9bef;margin-top:10px;overflow:hidden}.m-bar i{display:block;height:100%;background:var(--pink)}
.m-accgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.acc{border:0;background:var(--card);border-radius:18px;padding:14px;margin:0;grid-template-columns:1fr;gap:6px;align-content:start;box-shadow:var(--shadow)}
.acc>span:first-child{display:none}
.acc .nm{font-size:13.5px;color:var(--ink-2);font-weight:500;line-height:1.25}
.acc .amt{font-size:19px;font-weight:700;letter-spacing:-.02em}
.acc .amt.neg{color:var(--bad)}
.tabbar{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;border-radius:26px;padding:8px 6px;background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--dash);box-shadow:0 10px 30px -10px rgba(0,0,0,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tab{font-size:11.5px;font-weight:500}
.tab[aria-current="page"]{color:var(--pink)}
.fab{border-radius:20px;width:58px;height:58px;font-size:32px;bottom:calc(92px + env(safe-area-inset-bottom,0px));box-shadow:0 10px 24px -8px var(--pink)}
.sheet{background:var(--card);border-top:0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .grab{background:var(--dash)}
.seg{background:var(--bg-2)}.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.fsec{letter-spacing:.06em;font-size:12.5px;color:var(--muted)}
.frow input{border-color:var(--dash);background:var(--bg-2)}
.savetop button{color:var(--pink)}
.btn.pri{background:var(--pink)}.btn.sec{background:var(--bg-2)}
.txe{background:var(--bg);background-image:none}
.xtop b{letter-spacing:-.01em;font-size:17px;text-transform:none}
.ty{letter-spacing:0;font-size:13.5px;text-transform:none;font-weight:600;background:var(--card);border:1px solid var(--dash)}
.ty[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bigamt{font-weight:700;letter-spacing:-.04em}
.xrows{background:var(--card);border-radius:20px;padding:0 16px;box-shadow:var(--shadow)}
.xrow{border-bottom:1px solid var(--dash);font-size:16px;padding:16px 0}
.xrow .xv{font-size:15.5px}
.xrow .scegli{letter-spacing:0;text-transform:none;font-weight:600;color:var(--pink)}
.xrows textarea{font-size:16px}
.keypad{background:var(--card);border-top:1px solid var(--dash)}
.k{background:var(--bg-2);color:var(--ink);border-radius:14px}
.k:active{background:var(--dash)}
.k.kb svg{stroke:var(--ink)}
.psearch{background:var(--card);border:1px solid var(--dash)}
.pitem{border-bottom:1px solid var(--dash)}
.pitem[aria-pressed="true"]{color:var(--pink)}
.srow{border-bottom:1px solid var(--dash)}.kv{border-bottom:1px solid var(--dash)}
.sbig{border:0;background:var(--card);box-shadow:var(--shadow)}
.ichoice{background:var(--card);border:1px solid var(--dash)}.ichoice svg{stroke:var(--ink)}.ichoice[aria-pressed="true"]{background:var(--pink);border-color:var(--pink)}.ichoice[aria-pressed="true"] svg{stroke:#fff}
.cchoice[aria-pressed="true"]{border-color:var(--card)}
.toast{background:var(--ink);color:var(--bg)}
.status{color:var(--muted)}
.linkbtn{color:var(--pink)}
body.light .tabbar{background:rgba(255,255,255,.85)}

/* ---- tema chiaro a colori ---- */
:root{--bg:#f7f5f1;--bg-2:#efece6;--card:#ffffff;--ink:#16181c;--ink-2:#4b5059;--muted:#8a8f98;--dash:rgba(22,24,28,.07);
  --pink:#ff5a3d;--pink-soft:rgba(255,90,61,.12);--good:#16a05a;--bad:#e2402f;--warn:#d18a00;
  --c-blue:#3d7bf5;--c-green:#16a05a;--c-coral:#ff5a3d;--c-violet:#7a5cf0;--c-amber:#f2a516;--c-teal:#0fa3a3;--c-rose:#ec4f8b;
  --t-blue:#e7efff;--t-green:#e3f5ea;--t-coral:#ffebe5;--t-violet:#efeaff;--t-amber:#fff3d9;--t-teal:#dff5f4;--t-rose:#fde7f0;
  --shadow:0 1px 2px rgba(20,20,30,.04),0 10px 26px -14px rgba(20,20,40,.18)}
html,body{background:var(--bg)}
.topbar{background:color-mix(in srgb,var(--bg) 84%,transparent)}
/* titoli di sezione colorati */
.script{color:var(--ink);font-size:14px;letter-spacing:.02em;text-transform:none;font-weight:700;display:flex;align-items:center;gap:8px}
.script::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c-violet)}
.clist+.script::before,.script:nth-of-type(2)::before{background:var(--c-green)}
.script:nth-of-type(3)::before{background:var(--c-coral)}
/* riepilogo a tre colori */
.summary>div{box-shadow:none}
.summary>div:nth-child(1){background:var(--t-blue)}.summary>div:nth-child(1) .hl::before{background:var(--c-blue)}
.summary>div:nth-child(2){background:var(--t-green)}.summary>div:nth-child(2) .hl::before{background:var(--c-green)}
.summary>div:nth-child(3){background:var(--t-coral)}.summary>div:nth-child(3) .hl::before{background:var(--c-coral)}
.summary .hl{color:var(--ink-2)}
/* budget */
.m-bcard{background:linear-gradient(135deg,#fff1e6 0%,#f4ecff 100%);box-shadow:none}
.m-ring circle:first-child{stroke:rgba(255,255,255,.75)}
.pill.neutral{background:rgba(255,255,255,.7);color:var(--ink-2)}
/* entrate e spese */
.clist{box-shadow:var(--shadow)}
/* transazioni */
.m-group{box-shadow:var(--shadow)}
.m-day:nth-of-type(7n+1) .m-dnum{color:var(--c-blue)}
.m-day:nth-of-type(7n+2) .m-dnum{color:var(--c-coral)}
.m-day:nth-of-type(7n+3) .m-dnum{color:var(--c-green)}
.m-day:nth-of-type(7n+4) .m-dnum{color:var(--c-violet)}
.m-day:nth-of-type(7n+5) .m-dnum{color:var(--c-amber)}
.m-day:nth-of-type(7n+6) .m-dnum{color:var(--c-teal)}
.m-day:nth-of-type(7n+7) .m-dnum{color:var(--c-rose)}
.chip{background:#fff}
.chip[aria-pressed="true"]{background:var(--c-violet);border-color:var(--c-violet);color:#fff}
/* conti */
.nw{background:linear-gradient(135deg,#ffe8de 0%,#f1e9ff 55%,#e3efff 100%);box-shadow:none}
.nw .hl{color:var(--ink-2)}
.m-bar{background:var(--c-blue)}.m-bar i{background:var(--c-coral)}
.m-split i{background:var(--c-coral)!important}.m-split span+span i{background:var(--c-blue)!important}
.acc{box-shadow:none}
.m-accgrid .acc:nth-child(7n+1){background:var(--t-blue)}
.m-accgrid .acc:nth-child(7n+2){background:var(--t-green)}
.m-accgrid .acc:nth-child(7n+3){background:var(--t-violet)}
.m-accgrid .acc:nth-child(7n+4){background:var(--t-coral)}
.m-accgrid .acc:nth-child(7n+5){background:var(--t-amber)}
.m-accgrid .acc:nth-child(7n+6){background:var(--t-teal)}
.m-accgrid .acc:nth-child(7n+7){background:var(--t-rose)}
/* barra in basso e pulsante + */
.tabbar{background:rgba(255,255,255,.9);box-shadow:0 12px 30px -12px rgba(30,30,60,.3)}
.tab[aria-current="page"]{color:var(--c-violet)}
.fab{background:linear-gradient(135deg,#ff7a3d 0%,#ff4f7b 100%);box-shadow:0 12px 24px -10px rgba(255,79,123,.7)}
/* nuova transazione */
.ty[data-t="s"][aria-pressed="true"]{background:var(--c-coral);border-color:var(--c-coral);color:#fff}
.ty[data-t="e"][aria-pressed="true"]{background:var(--c-green);border-color:var(--c-green);color:#fff}
.ty[data-t="t"][aria-pressed="true"]{background:var(--c-blue);border-color:var(--c-blue);color:#fff}
.ty[aria-pressed="true"] svg{stroke:#fff!important}
.keypad{background:#f0ede7;border-top:0}
.k{background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.xrow .scegli{color:var(--c-violet)}
.btn.pri{background:linear-gradient(135deg,#ff7a3d 0%,#ff4f7b 100%)}
.seg button[aria-pressed="true"]{color:var(--c-violet)}
.savetop button,.linkbtn{color:var(--c-violet)}
.sheet{background:#fff}
.mnav .ptitle i{background:var(--c-violet)}

/* ---- conti in colonna, transazioni come prima ---- */
.m-accgrid{grid-template-columns:1fr;gap:10px}
.acc{grid-template-columns:1fr auto;align-items:center;padding:18px 20px;gap:12px;border-radius:18px}
.acc .nm{font-size:17.5px;color:var(--ink);font-weight:500}
.acc .amt{font-size:17.5px;font-weight:600;letter-spacing:-.01em}
.acc .amt.neg{color:inherit}
.tx{grid-template-columns:44px 1fr auto;gap:4px 14px;padding:14px 0}
.tx .nm{font-size:17.5px;font-weight:500}
.tx .ac{font-size:14.5px;color:var(--muted)}
.tx .amt{font-size:17.5px;font-weight:500}
.tx .note{grid-column:1/-1;font-size:15px;color:var(--ink-2);padding-left:2px}
.tx::after{left:0}
.tx .ico{width:40px;height:40px}

/* ---- icone categorie: pastello con simbolo colorato ---- */
.ico{--ic:#8e9097;background:linear-gradient(160deg,color-mix(in srgb,var(--ic) 12%,#fff) 0%,color-mix(in srgb,var(--ic) 24%,#fff) 100%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ic) 20%,transparent);border-radius:13px}
.ico svg{stroke:color-mix(in srgb,var(--ic) 82%,#000);stroke-width:2;width:20px;height:20px}
.ico .ltr{color:color-mix(in srgb,var(--ic) 82%,#000)}
.ico.sm{border-radius:11px}.ico.sm svg{width:17px;height:17px}
.xrow .xv .ico svg{stroke:color-mix(in srgb,var(--ic) 82%,#000)}
.cat[aria-pressed="true"] .ico,.pitem[aria-pressed="true"] .ico{box-shadow:inset 0 0 0 2px var(--ic)}
.ico.emo{background:linear-gradient(150deg,color-mix(in srgb,var(--ic) 14%,#fff) 0%,color-mix(in srgb,var(--ic) 30%,#fff) 100%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ic) 18%,transparent),0 2px 6px -2px color-mix(in srgb,var(--ic) 45%,transparent)}
.ico.emo .em{font-size:23px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
.ico.emo.sm .em{font-size:17px}
/* ===== conti: lista chiara e riordinabile ===== */
.nw .k-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.nw .k-sum div{background:rgba(255,255,255,.7);border-radius:14px;padding:10px 12px;min-width:0}
.nw .k-sum small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw .k-sum b{display:block;font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.k-head{display:flex;align-items:center;gap:8px;margin:22px 2px 10px}
.k-head h3{flex:1;margin:0;font-size:17px;font-weight:700}
.k-btn{border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--ink);color:#fff;cursor:pointer}
.k-btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--dash)}
.k-list{background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px -12px rgba(0,0,0,.18);overflow:hidden}
.k-row{display:flex;align-items:center;background:var(--card);position:relative}
.k-row+.k-row::before{content:"";position:absolute;top:0;left:72px;right:16px;height:1px;background:var(--dash)}
.k-list.editing .k-row+.k-row::before{left:104px}
.k-main{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 16px;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;margin:0;box-shadow:none;border-radius:0}
.k-main.off{cursor:default;padding-left:6px}
.k-main .ico{width:42px;height:42px}
.k-txt{min-width:0}
.k-nm{display:block;font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.k-sub .warn{color:var(--warn)}
.k-amt{font-size:16.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.k-handle{padding:0 4px 0 14px;cursor:grab;touch-action:none;display:flex;align-items:center;height:70px}
.k-handle svg{width:22px;height:22px;stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round}
.k-arrows{display:flex;flex-direction:column;gap:2px;padding-right:10px}
.k-arrows button{border:0;background:var(--bg-2);color:var(--ink-2);border-radius:8px;width:30px;height:26px;font-size:14px;cursor:pointer}
.k-row.drag{z-index:2;box-shadow:0 12px 28px -8px rgba(0,0,0,.3);border-radius:14px}
.k-row.drag .k-handle{cursor:grabbing}
.k-row:not(.drag){transition:transform .15s}
/* ===== tema scuro ===== */
html.dark{color-scheme:dark;background:#111214}
html.dark body:not(.light){--bg:#111214;--bg-2:#22252a;--card:#1b1d21;--ink:#f1f1ef;--ink-2:#b8bcc4;--muted:#80858e;--dash:rgba(255,255,255,.08);
  --good:#3ccf7f;--bad:#ff6b5c;--warn:#f0b43c;--c-blue:#6c9dff;--c-green:#3ccf7f;--c-coral:#ff7a5c;--c-violet:#9b85ff;--c-amber:#f6b83a;--c-teal:#33c4c4;--c-rose:#f2709f;
  --t-blue:#1a2438;--t-green:#162a20;--t-coral:#33201b;--t-violet:#231f38;--t-amber:#2f2714;--t-teal:#132b2b;--t-rose:#321b26;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);background:#111214;color:var(--ink)}
html.dark body:not(.light) .topbar{background:color-mix(in srgb,#111214 84%,transparent)}
html.dark body:not(.light) .chip{background:var(--card)}
html.dark body:not(.light) .m-bcard{background:linear-gradient(135deg,#2c2019 0%,#231d33 100%)}
html.dark body:not(.light) .m-ring circle:first-child{stroke:rgba(255,255,255,.1)}
html.dark body:not(.light) .pill.neutral{background:rgba(255,255,255,.08)}
html.dark body:not(.light) .nw{background:linear-gradient(135deg,#2e1f1a 0%,#241d35 55%,#18233a 100%)}
html.dark body:not(.light) .tabbar{background:rgba(30,32,36,.88);border-color:rgba(255,255,255,.06);box-shadow:0 12px 30px -12px rgba(0,0,0,.7)}
html.dark body:not(.light) .keypad{background:#16181b}
html.dark body:not(.light) .k{background:#24272c;box-shadow:none}
html.dark body:not(.light) .sheet{background:#1b1d21}
html.dark body:not(.light) .k-btn{background:var(--ink);color:#111214}
html.dark body:not(.light) .k-btn.ghost{background:var(--card);color:var(--ink)}
html.dark body:not(.light) .seg button[aria-pressed="true"]{background:#2e3137}
html.dark body:not(.light) .ico{background:linear-gradient(160deg,color-mix(in srgb,var(--ic) 22%,#1b1d21) 0%,color-mix(in srgb,var(--ic) 34%,#1b1d21) 100%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ic) 30%,transparent)}
html.dark body:not(.light) .ico svg,html.dark body:not(.light) .xrow .xv .ico svg{stroke:color-mix(in srgb,var(--ic) 70%,#fff)}
html.dark body:not(.light) .ico .ltr{color:color-mix(in srgb,var(--ic) 70%,#fff)}
html.dark body:not(.light) .toast{background:#f1f1ef;color:#111214}
/* loghi dei conti */
.ico.logo{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);overflow:hidden}
.ico.logo svg{width:22px;height:22px;stroke:none!important}
.ico.logo.sm svg{width:18px;height:18px}.ico.logo.full svg,.ico.logo img{width:100%;height:100%;display:block;object-fit:cover}
html.dark body:not(.light) .ico.logo{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
/* ===== home: saldo al centro, spese ed entrate sotto ===== */
.h-sum{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:20px 16px 16px;margin-top:8px;text-align:center}
.h-saldo span{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.h-saldo b{display:block;font-size:clamp(32px,9vw,40px);font-weight:700;letter-spacing:-.04em;margin-top:2px;font-variant-numeric:tabular-nums}
.h-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.h-two>div{border-radius:16px;padding:12px;text-align:left}
.h-two span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.h-two b{display:block;font-size:clamp(17px,5vw,21px);font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.h-sp{background:var(--t-coral)}.h-sp span{color:var(--c-coral)}
.h-in{background:var(--t-green)}.h-in span{color:var(--c-green)}
/* ===== spese controllate ===== */
.chk{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px 14px;border:0;border-radius:18px;background:var(--t-teal);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.chk b{display:block;font-size:14.5px;font-weight:700}
.chk small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.chk-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c-teal);color:#fff;font-weight:800;font-size:15px}
.chk.old{background:var(--t-amber)}.chk.old .chk-ic{background:var(--c-amber)}
.chk.none{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--dash)}.chk.none .chk-ic{background:var(--bg-2);color:var(--muted)}
.chk-go{font-size:22px;color:var(--muted)}
.chk-line{display:flex;align-items:center;gap:10px;margin:22px 2px 0;color:var(--c-teal);font-size:12.5px;font-weight:700}
.chk-line::before,.chk-line::after{content:"";flex:1;height:2px;border-radius:1px;background:currentColor;opacity:.35}
/* ===== approfondimenti in tema scuro ===== */

/* ===== abbonamenti ===== */
.xsub{cursor:default}
.subseg{display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--bg-2);border-radius:10px;padding:3px}
.subseg button{border:0;background:none;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
.subseg button[aria-pressed="true"]{background:var(--card);color:var(--c-violet);box-shadow:var(--shadow)}
.subhint{font-size:12.5px;color:var(--muted);padding:6px 0 10px;border-bottom:1px solid var(--dash)}
.sub-btn{border:0;border-radius:999px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;background:#15191c;color:#fff;cursor:pointer;white-space:nowrap}
.sub-btn.ghost{background:none;color:#858a82;box-shadow:inset 0 0 0 1px #d8d9d2}
.sub-soon{display:grid;gap:6px;margin:6px 0 4px}
.sub-soon div{display:flex;justify-content:space-between;gap:10px;background:#fff6e0;border-radius:10px;padding:8px 10px;font-size:13.5px}
.sub-soon span{color:#4c524f;text-align:right}
html.dark body.light .sub-btn{background:#f1f1ef;color:#111214}

.sub-list{display:grid}

.sub-v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.sub-act{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
html.dark body.light .sub-it{border-bottom-color:rgba(255,255,255,.07)}
html.dark body.light .sub-it small{color:#8a8f98}
.sub-btns{display:flex;gap:6px}
.sub-btn.warn{background:#c2412f!important;color:#fff!important;box-shadow:none!important}
/* ================= stile app iOS ================= */
:root{--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --bg:#f2f2f7;--bg-2:#e9e9ee;--card:#ffffff;--ink:#000000;--ink-2:#3c3c43;--muted:#8a8a8e;--dash:rgba(60,60,67,.16);--press:#e5e5ea;
  --shadow:0 1px 1px rgba(0,0,0,.02)}
html.dark body:not(.light){--bg:#000;--bg-2:#1c1c1e;--card:#1c1c1e;--ink:#fff;--ink-2:#ebebf5;--muted:#8d8d93;--dash:rgba(84,84,88,.6);--press:#2c2c2e;background:#000}
html.dark{background:#000}
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{font-family:var(--sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.wrap{padding-inline:16px}
/* barra in alto */
.topbar{padding-block:10px 6px;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.mnav .ptitle{font-size:17px;font-weight:600;letter-spacing:-.02em}
/* titoli di sezione */
.script{font-size:20px!important;font-weight:700!important;letter-spacing:-.02em!important;margin:26px 4px 8px!important;color:var(--ink)!important}
.script::before{display:none!important}
/* liste stile iOS */
.clist,.m-group,.k-list,.xrows{background:var(--card)!important;border-radius:18px!important;box-shadow:none!important;padding:0 0 0 16px!important;overflow:hidden}
.crow,.tx{min-height:56px;padding:10px 16px 10px 0!important;grid-template-columns:34px 1fr auto!important;gap:2px 12px!important;transition:background .15s}
.crow::after,.tx::after{left:46px!important;right:0!important;border-bottom:.5px solid var(--dash)!important}
.crow:active,.tx:active,.k-main:active,.chk:active{background:var(--press)}
.crow:active,.tx:active{box-shadow:-16px 0 0 var(--press)}
.crow .nm,.tx .nm{font-size:17px!important;font-weight:400!important}
.crow .amt,.tx .amt{font-size:17px!important;font-weight:500!important;font-variant-numeric:tabular-nums}
.tx .ac{font-size:13px!important;color:var(--muted)!important}
.tx .note{grid-column:2/-1!important;font-size:14px!important;color:var(--ink-2)!important;opacity:.8}
.ico,.tx .ico,.k-main .ico{width:34px!important;height:34px!important;border-radius:9px!important}
.ico.emo .em{font-size:19px!important}
.ico.sm{width:28px!important;height:28px!important;border-radius:8px!important}.ico.emo.sm .em{font-size:16px!important}
.ico.emo{box-shadow:none!important}
.k-row+.k-row::before{left:62px!important;background:var(--dash)!important;height:.5px!important}
.k-main{padding:10px 16px 10px 0!important;min-height:60px}
.k-nm{font-size:17px!important;font-weight:400!important}.k-amt{font-size:17px!important;font-weight:500!important}
/* giorni in transazioni */
.m-day{margin:22px 4px 8px!important}
.m-dnum{font-size:26px!important}
/* riquadri in alto */
.h-sum,.nw,.m-bcard,.bcard{border-radius:22px!important;box-shadow:none!important}
.h-saldo b,.nw .big{font-weight:700!important;letter-spacing:-.035em!important}
.h-two>div{border-radius:14px!important}
.chk{border-radius:18px!important}
/* barra delle schede: vetro, come le app iOS */
.tabbar{left:16px!important;right:16px!important;bottom:calc(8px + env(safe-area-inset-bottom,0px))!important;border-radius:32px!important;padding:6px!important;
  background:color-mix(in srgb,var(--card) 90%,transparent)!important;-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:.5px solid color-mix(in srgb,var(--ink) 10%,transparent)!important;box-shadow:0 8px 28px -10px rgba(0,0,0,.25)!important}
.tab{font-size:10px!important;font-weight:600!important;gap:2px!important;padding:6px 0 5px!important;border-radius:26px;color:var(--muted)!important;transition:background .2s,color .2s}
.tab svg{width:24px!important;height:24px!important;stroke-width:1.9!important}
.tab[aria-current="page"]{color:var(--c-violet)!important;background:color-mix(in srgb,var(--c-violet) 12%,transparent)}
.tab:active{transform:scale(.94)}
/* pulsante + */
.fab{width:56px!important;height:56px!important;border-radius:50%!important;font-size:0!important;bottom:calc(84px + env(safe-area-inset-bottom,0px))!important;right:max(20px,calc(50% - 260px))!important;
  box-shadow:0 8px 20px -6px rgba(255,79,123,.55)!important;transition:transform .15s}
.fab::before,.fab::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:2.5px;border-radius:2px;background:#fff;transform:translate(-50%,-50%)}
.fab::after{transform:translate(-50%,-50%) rotate(90deg)}
.fab:active{transform:scale(.92)}
/* pressione su pulsanti */
.chip:active,.btn:active,.k-btn:active,.sub-btn:active,.k:active{transform:scale(.96)}
.chip,.btn,.k-btn,.k{transition:transform .12s}
/* passaggio tra le schede */
#view{animation:tabin .22s ease-out}
@keyframes tabin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* spazio in fondo per la barra */
main#view{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
/* ===== nuova transazione: proporzioni da telefono ===== */
.txe{height:100dvh;bottom:auto}
.xinner{padding:0 16px!important}
.xtop{padding-top:6px}
.types{margin-top:8px!important;gap:8px!important;justify-content:center!important}
.ty{padding:7px 12px!important;font-size:14px!important}
.bigamt{font-size:clamp(44px,13vw,54px)!important;margin:18px 0 16px!important}
.xrows{padding-left:16px!important}
.xrow{padding:13px 16px 13px 0!important;font-size:16px!important;min-height:50px}
.xrow .xv{font-size:16px!important}
.xrows textarea{font-size:16px!important;padding:13px 16px 13px 0!important;height:48px;min-height:48px}
.keypad{padding:10px 12px max(30px,calc(env(safe-area-inset-bottom,0px) + 14px))!important;gap:7px!important;border-radius:22px 22px 0 0!important}
.k{height:50px!important;border-radius:12px!important}
.k b{font-size:24px!important}.k small{font-size:9px!important}
@media (max-height:740px){.bigamt{margin:10px 0 10px!important;font-size:44px!important}.xrow{padding:10px 16px 10px 0!important;min-height:44px}.k{height:44px!important}.types{margin-top:4px!important}}
.types{gap:6px!important;padding:0 2px}
.ty{padding:7px 10px!important;font-size:13px!important;gap:5px!important}
.ty svg{width:16px!important;height:16px!important}
.xrows textarea{display:block;width:100%;box-sizing:border-box}
.xrows .err:empty{display:none}
/* ===== transazioni stile Fleur ===== */
.tx.fl{display:grid!important;grid-template-columns:36px 1fr auto!important;align-items:center!important;gap:0 12px!important;min-height:58px;padding:9px 14px 9px 0!important}
.tx.fl::after{left:48px!important}
.tx.fl .ico{width:36px!important;height:36px!important;border-radius:50%!important}
.tx.fl .ico.emo .em{font-size:18px!important}
.fl-l,.fl-r{display:flex;flex-direction:column;min-width:0}
.fl-r{align-items:flex-end;gap:7px}
.tx.fl .nm{font-size:15.5px!important;font-weight:500!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-n{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx.fl .amt{font-size:15.5px!important;font-weight:600!important;line-height:1}
.tx.fl .amt.in{color:var(--good)}
.fl-acc{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);line-height:1;white-space:nowrap}
.tx.fl .fl-acc .ico{width:16px!important;height:16px!important;border-radius:50%!important;flex:none}
.tx.fl .fl-acc .ico.emo .em{font-size:10px!important}
.tx.fl .fl-acc .ico.logo svg{width:11px!important;height:11px!important}
.fl-arr{opacity:.7}
.m-group{padding-left:14px!important}
/* ===== icone categorie tonde ovunque ===== */
.ico:not(.logo),.ico.sm:not(.logo),.tx .ico:not(.logo),.k-main .ico:not(.logo),.crow .ico,.pitem .ico:not(.logo),.xrow .xv .ico:not(.logo){border-radius:50%!important}
.ico.logo{border-radius:50%!important}
.k-main .ico{border-radius:50%!important}
.ichoice,.cchoice{border-radius:50%}
/* ================= STILE NUOVO (v2) — tutto qui sotto vale solo con html.v2 ================= */
html.v2{--acc:#6b4eff;--c-violet:#6b4eff;--pink:#6b4eff}
html.v2.dark body:not(.light){--acc:#8b74ff;--c-violet:#8b74ff}
html:not(.v2) .v2-dline,html:not(.v2) .sw-act{display:none}
/* 9: un solo colore */
html.v2 .fab{background:var(--acc)!important;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--acc) 60%,transparent)!important}
html.v2 .btn.pri{background:var(--acc)!important}
html.v2 .chip[aria-pressed="true"]{background:var(--acc)!important;border-color:var(--acc)!important}
html.v2 .tab[aria-current="page"]{color:var(--acc)!important;background:color-mix(in srgb,var(--acc) 12%,transparent)!important}
html.v2 .ty[data-t="s"][aria-pressed="true"]{background:var(--acc)!important;border-color:var(--acc)!important}
html.v2 .m-dnum{color:var(--ink)!important}
html.v2 .h-sp,html.v2 .h-in{background:var(--bg)!important}
html.v2 .h-sp span{color:var(--ink-2)!important}
html.v2 .m-bcard,html.v2 .nw{background:var(--card)!important}
/* 1: andamento saldo */
.v2-spark{margin:6px -4px 2px}
.v2-spark svg{display:block;width:100%;height:46px}
.v2-spark span{display:block;font-size:12.5px;font-weight:600;margin-top:2px}
.v2-spark .up{color:var(--good)}.v2-spark .down{color:var(--muted)}
/* 2: barre categorie */
.v2-cbar{display:block;height:4px;border-radius:2px;background:var(--bg-2);margin-top:6px;overflow:hidden;max-width:180px}
.v2-cbar i{display:block;height:100%;border-radius:2px}
.v2-pct{display:block;font-size:11.5px;color:var(--muted);font-weight:500;text-align:right;margin-top:2px}
html.v2 .crow .nm{display:flex;flex-direction:column}
/* 4: ricerca */
html.v2 .search{margin-top:2px}
html.v2 .search input{border-radius:12px;background:var(--card)!important;border:0!important;padding:10px 14px;font-size:16px}
/* 5: intestazione giorno */
html.v2 .m-day{display:block!important;margin:20px 4px 6px!important}
html.v2 .m-day .m-dnum,html.v2 .m-day .m-dwd{display:none}
html.v2 .v2-dline{font-size:13px;font-weight:600;color:var(--muted);text-transform:none}
html.v2 .m-dtot{float:right;font-size:13px!important}
/* 6: scorri per modificare / eliminare */
.sw{position:relative;overflow:hidden}
.sw .tx{position:relative;z-index:1;background:var(--card);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sw-act{position:absolute;right:0;top:0;bottom:0;display:flex;z-index:0}
.sw-act button{border:0;width:75px;color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.sw-ed{background:#8e8e93}.sw-del{background:#ff3b30}
.sw:not(:last-child) .tx::after{display:block!important}
.m-group .sw:last-child .tx::after{display:none!important}
/* 7: valore netto con ciambella */
.v2-nw{display:flex!important;align-items:center;gap:12px}
.v2-nwt{flex:1;min-width:0}
.v2-nw .big{font-size:clamp(26px,7.4vw,32px)!important;white-space:nowrap}
.v2-donut{width:70px;height:70px;flex:none}
.v2-leg{display:grid;gap:4px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.v2-leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.v2-leg b{font-weight:600;color:var(--ink)}
/* 8: gruppi di conti */
.v2-gh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 6px 6px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.v2-gh b{font-size:13px;color:var(--ink-2);font-weight:600;text-transform:none;letter-spacing:0}
/* 11: conferma salvataggio */
.toast.pop{animation:tpop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes tpop{0%{transform:translateX(-50%) scale(.85)}60%{transform:translateX(-50%) scale(1.06)}100%{transform:translateX(-50%) scale(1)}}
/* 12: nuova transazione come foglio dal basso */
html.v2 .txe{top:max(36px,env(safe-area-inset-top,0px))!important;height:auto!important;bottom:0!important;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25),0 0 0 100vmax rgba(0,0,0,.32);overflow:hidden}
html.v2 .txe::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--dash);margin:8px auto 0;flex:none}
html.v2 .txe.sheet-in{animation:sheetup .32s cubic-bezier(.2,.9,.25,1)}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
/* giorno: numero grande colorato + testo su una riga */
html.v2 .m-day{display:flex!important;align-items:baseline;gap:8px}
html.v2 .m-day .m-dnum{display:inline!important;font-size:24px!important;line-height:1}
html.v2 .m-day .m-dwd{display:inline!important;font-size:14px;font-weight:600}
html.v2 .m-day .m-dwd small{display:inline!important;font-size:13px;margin-left:5px;font-weight:500}
html.v2 .m-day .v2-dline{display:none}
html.v2 .m-dtot{float:none!important;margin-left:auto}
html.v2 .m-day:nth-of-type(7n+1) .m-dnum{color:var(--c-blue)!important}
html.v2 .m-day:nth-of-type(7n+2) .m-dnum{color:var(--c-coral)!important}
html.v2 .m-day:nth-of-type(7n+3) .m-dnum{color:var(--c-green)!important}
html.v2 .m-day:nth-of-type(7n+4) .m-dnum{color:#7a5cf0!important}
html.v2 .m-day:nth-of-type(7n+5) .m-dnum{color:var(--c-amber)!important}
html.v2 .m-day:nth-of-type(7n+6) .m-dnum{color:var(--c-teal)!important}
html.v2 .m-day:nth-of-type(7n+7) .m-dnum{color:var(--c-rose)!important}
/* grafico saldo in Statistiche */
.bal-wrap{position:relative;margin-top:8px;touch-action:pan-y}
.bal-wrap svg{display:block;width:100%;height:190px;overflow:visible}
.bal-pt{position:absolute;top:0;transform:translateX(-50%);background:#15191c;color:#fff;border-radius:10px;padding:6px 10px;font-size:12.5px;white-space:nowrap;pointer-events:none}
.bal-pt b{display:block;font-size:15px}
.bal-info{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.bal-info b{font-size:24px;font-variant-numeric:tabular-nums}
.bal-info span{font-size:13px;color:#858a82}
html.dark body.light .bal-pt{background:#f1f1ef;color:#111214}
/* ===== margine in basso (la vista di Claude può essere più alta dello schermo) ===== */
:root{--bx:24px}
.tabbar{bottom:calc(var(--bx) + env(safe-area-inset-bottom,0px))!important}
.fab{bottom:calc(var(--bx) + 76px + env(safe-area-inset-bottom,0px))!important}
.toast{bottom:calc(var(--bx) + 150px + env(safe-area-inset-bottom,0px))!important}
main#view{padding-bottom:calc(var(--bx) + 110px + env(safe-area-inset-bottom,0px))!important}
.keypad{padding-bottom:calc(var(--bx) + 12px + env(safe-area-inset-bottom,0px))!important}
/* la tastiera sta subito sotto i campi, non incollata al fondo */
.txe{overflow-y:auto!important}
.txe .xinner{flex:none!important;overflow:visible!important}
.txe .keypad{margin-top:14px!important}
.txe::after{content:"";flex:1}
/* scelta categoria a griglia, stile Fleur */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);margin:10px -4px 0}
.pcell{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:118px;padding:16px 4px!important;border:0!important;border-right:1px dashed var(--dash)!important;border-bottom:1px dashed var(--dash)!important;background:none;border-radius:0;width:auto!important;font-size:15px!important;text-align:center;color:var(--ink)}
.pcell:nth-child(3n){border-right:0!important}
.pcell span:last-child{line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pcell .pg{width:38px;height:38px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pcell .pg.em{font-size:34px;line-height:1;width:auto;height:auto;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pcell .pg.ltr{font-size:30px;font-weight:800;width:auto;height:auto}
.pcell[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 7%,transparent)!important;border-radius:16px}
.pcell:active{background:color-mix(in srgb,var(--ink) 10%,transparent)!important}
.pnew{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;font-weight:500;cursor:pointer;padding:6px 0;white-space:nowrap}
.pnew svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
/* icone piene (come nel Taccuino originale) */
.ico.phi svg.ph{fill:color-mix(in srgb,var(--ic) 85%,#000)!important;stroke:none!important;width:56%!important;height:56%!important}
html.dark body:not(.light) .ico.phi svg.ph{fill:color-mix(in srgb,var(--ic) 75%,#fff)!important}
.pcell svg.pg.ph{stroke:none!important;width:40px;height:40px}
/* testi un po' più piccoli (tranne la barra in basso) */
#view,.topbar,.txe .xinner,#set .xinner,.sheet{zoom:.9}
/* note: niente zoom di iOS e via il tastierino numerico mentre scrivi */
.txe .xinner textarea,.txe .xinner input,#set .xinner input,#set .xinner textarea,#view input{font-size:17.8px!important}
.sheet input{font-size:17.8px!important}
.txe.typing .keypad{display:none!important}.txe.typing .xinner{padding-bottom:45vh!important}
.h-saldo b.pos-saldo,.nw .big.pos-saldo{color:#16a05a!important}
html.dark body:not(.light) .h-saldo b.pos-saldo,html.dark body:not(.light) .nw .big.pos-saldo{color:#3ccf7f!important}
/* accesso */
.login{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lg-box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lg-ic{font-size:54px}.lg-box h1{margin:0;font-size:28px;letter-spacing:-.02em}.lg-box p{margin:0 0 6px;color:var(--ink-2);font-size:15px;line-height:1.45}
.lg-box input{font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:1px solid var(--dash);background:var(--card);color:var(--ink)}
.lg-box .btn{padding:14px;border-radius:14px;font-size:17px}
.lg-file{display:block;cursor:pointer}
/* intestazione a tutta larghezza */
.topbar{box-shadow:0 0 0 100vmax color-mix(in srgb,var(--bg) 84%,transparent);clip-path:inset(0 -100vmax)}
/* ===== app a schermo intero: barra in alto che scorre via, barra in basso piena come Fleur ===== */
.topbar{position:relative!important;top:auto!important;padding-top:calc(env(safe-area-inset-top,0px) + 8px)!important;background:var(--bg)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important;clip-path:none!important}
.tabbar{left:0!important;right:0!important;bottom:0!important;max-width:none!important;margin:0!important;border-radius:0!important;border:0!important;border-top:.5px solid var(--dash)!important;box-shadow:none!important;
  background:var(--bg)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)!important}
html.dark body:not(.light) .tabbar{background:#111214!important}
html .tab[aria-current="page"],html.v2 .tab[aria-current="page"]{background:none!important}
.fab{bottom:calc(env(safe-area-inset-bottom,0px) + 78px)!important}
main#view{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px)!important}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)!important}
.r-tabs{top:0!important;position:relative!important}
/* ===== righe tratteggiate, stile Fleur ===== */
html.rows-dash{--dl:rgba(22,24,28,.22)}
html.rows-dash.dark{--dl:rgba(255,255,255,.22)}
html.rows-dash .clist,html.rows-dash .m-group,html.rows-dash .k-list{background:none!important;box-shadow:none!important;border-radius:0!important;padding:0!important;overflow:visible!important}
html.rows-dash .crow,html.rows-dash .tx,html.rows-dash .k-main{padding-left:2px!important}
html.rows-dash .crow::after,html.rows-dash .tx::after{left:46px!important;right:4px!important;border-bottom:1.5px dashed var(--dl)!important;display:block!important}
html.rows-dash .sw:last-child .tx::after,html.rows-dash .m-group>.tx:last-child::after{display:block!important}
html.rows-dash .crow:last-child::after{display:block!important}
html.rows-dash .k-row+.k-row::before{display:none!important}
html.rows-dash .k-row::after{content:"";position:absolute;left:62px;right:4px;bottom:0;border-bottom:1.5px dashed var(--dl)}
html.rows-dash .sw .tx{background:var(--bg)!important}
html.rows-dash .crow:active,html.rows-dash .tx:active{box-shadow:none!important}
html.rows-dash .m-day{margin-top:26px!important}
html.rows-dash .k-row,html.rows-dash .k-main{background:none!important}
/* tema scuro: sfondo grigio scuro come i riquadri, niente nero */
html.dark body:not(.light){--bg:#323236!important;--card:#3d3d42!important;--bg-2:#47474c!important;background:#323236!important}
html.dark{background:#323236!important}
html.dark body:not(.light) .tabbar{background:#323236!important}
html.dark body:not(.light) .topbar{background:#323236!important}
html.dark body:not(.light) .sw .tx{background:#323236!important}
html.dark body.light,html.dark body.light .topbar{background:#323236!important}
html.dark body.light{--bg:#323236!important;--card:#3d3d42!important}
.v2-cbar{display:none!important}
/* budget per voce a barre spesse */
.bb-list{margin-top:8px}
.bb{margin:0 0 16px}
.bbt{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bbt .ico{width:30px!important;height:30px!important;flex:none;border-radius:50%!important}
.bbn{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.2}
.bbn small{display:block;font-size:12px;font-weight:500;color:#858a82;margin-top:1px}
.bbt b{font-size:13.5px;font-weight:700;white-space:nowrap;color:#4c524f}
.bbt b.neg{color:#c2412f}
.bbar{position:relative;height:12px;border-radius:6px;background:#e7e7e1}
.bbar i{display:block;height:100%;border-radius:6px;min-width:4px}
.bbar em{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:#15191c;opacity:.55}
.bb-tot{border-top:1.5px solid #15191c;padding-top:12px;margin-top:4px}
html.dark body.light .bbn small{color:#8a8f98}
html.dark body.light .bbt b{color:#d6d8dc}
html.dark body.light .bbt b.neg{color:#ff7a66}
html.dark body.light .bbar{background:#2c2c2f}
html.dark body.light .bbar em{background:#fff;opacity:.7}
html.dark body.light .bb-tot{border-top-color:#f1f1ef}
/* occhio per nascondere il saldo */
.h-saldo span{display:inline-flex!important;align-items:center;gap:6px}
.eye{border:0;background:none;padding:4px;margin:-4px 0;color:var(--muted);cursor:pointer;display:inline-grid;place-items:center}
.eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hid{letter-spacing:.06em!important}
/* scrivi la spesa a parole */
.xai{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:6px 6px 6px 12px;margin-top:12px;box-shadow:inset 0 0 0 1px var(--dash)}
.xai input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:17.8px!important;outline:none;padding:6px 0}
.xai button{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;font-weight:700;background:var(--acc,#6b4eff);color:#fff;cursor:pointer}
/* budget per voce più compatto */
.bb{margin:0 0 10px!important}
.bbt{gap:8px!important;margin-bottom:4px!important}
.bbt .ico{width:22px!important;height:22px!important}
.bbn{font-size:14px!important;display:flex;align-items:baseline;gap:6px;white-space:nowrap;overflow:hidden}
.bbn small{display:inline!important;font-size:11.5px!important;margin:0!important;overflow:hidden;text-overflow:ellipsis}
.bbt b{font-size:12.5px!important}
.bbar{height:7px!important;border-radius:4px!important}.bbar i{border-radius:4px!important}
.bbar em{top:-2px!important;bottom:-2px!important}
.bb-tot{padding-top:8px!important}
/* salvadanaio semplice */
.pg-hero{margin:8px 0 14px}
.pg-hero span{display:block;font-size:13px;font-weight:600;color:#858a82}
.pg-hero>b{display:block;font-size:34px;font-weight:700;letter-spacing:-.03em;margin:2px 0 4px;color:#1f7a4d}
.pg-hero>b.neg{color:#c2412f}
.pg-hero small{font-size:12.5px;color:#858a82}.pg-hero small b{color:#4c524f}
.pg-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #e9eae4}
.pg-row .ico{width:24px!important;height:24px!important;flex:none;border-radius:50%!important}
.pg-row>b{font-size:14px;font-weight:700;white-space:nowrap}.pg-row>b.neg{color:#c2412f}
html.dark body.light .pg-hero>b{color:#3ccf7f}html.dark body.light .pg-hero>b.neg,html.dark body.light .pg-row>b.neg{color:#ff7a66}
html.dark body.light .pg-hero small b{color:#d6d8dc}
html.dark body.light .pg-row{border-bottom-color:rgba(255,255,255,.07)}
/* microfono + tastierino in fondo */
.xmic{background:none!important;color:var(--ink)!important;padding:6px!important;display:grid;place-items:center}
.xmic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.xmic.on{background:#ff3b30!important;color:#fff!important;border-radius:50%!important;animation:micp 1s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 0 6px rgba(255,59,48,.25)}}
.txe::after{content:none!important;display:none!important}
.txe .keypad{margin-top:auto!important}
.pg-row .bbn small{opacity:.75}
/* salvadanaio a tre colonne */
.pg3-h,.pg3{display:grid;grid-template-columns:24px minmax(0,1fr) 62px 66px 62px;align-items:center;gap:6px}
.pg3-h{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#858a82;margin-top:4px}
.pg3-h span,.pg3>span:not(.bbn):not(.ico),.pg3>b{text-align:right}
.pg3{width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:9px 0;border-bottom:1px solid #e9eae4;cursor:pointer}
.pg3 .ico{width:24px!important;height:24px!important;border-radius:50%!important}
.pg3 .bbn{font-size:13.5px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg3>span{font-size:12.5px;color:#4c524f;font-variant-numeric:tabular-nums}
.pg3>b{font-size:14px;font-variant-numeric:tabular-nums}
.pg3 .neg{color:#c2412f!important}
.pg3-tot{cursor:default;font-weight:700;border-bottom:0;border-top:1.5px solid #15191c}
html.dark body.light .pg3{border-bottom-color:rgba(255,255,255,.07)}
html.dark body.light .pg3>span{color:#b8bcc4}
html.dark body.light .pg3 .neg{color:#ff7a66!important}
html.dark body.light .pg3-tot{border-top-color:#f1f1ef}
/* dettaglio voce */
.vd-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}.vd-h .ico{width:42px;height:42px}
.vd-h h2{margin:0;font-size:20px}.vd-h small{color:var(--muted)}
.vd-chips{display:flex;flex-wrap:wrap;gap:6px}
.vd-chips span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--bg-2);font-size:13.5px}
.vd-chips .ico{width:22px!important;height:22px!important}
.vd-tbl{max-height:40vh;overflow:auto}
.vd-tbl div{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:7px 0;border-bottom:1px solid var(--dash);font-size:14px;font-variant-numeric:tabular-nums}
.vd-tbl div.old{opacity:.6}

const longD = d => { const x = D(d); return `${x.getDate()} ${ML[x.getMonth()]}${x.getFullYear() !== now.getFullYear() ? ' ' + x.getFullYear() : ''}`; };

function ring(p, today, col) {
  const R = 34, C = 2 * Math.PI * R, off = C * (1 - Math.min(100, p) / 100);
  const tk = today == null ? '' : (() => { const a = (today / 100) * 2 * Math.PI - Math.PI / 2; const x1 = 44 + Math.cos(a) * 27, y1 = 44 + Math.sin(a) * 27, x2 = 44 + Math.cos(a) * 41, y2 = 44 + Math.sin(a) * 41; return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>`; })();
  return `<svg class="m-ring" viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="${R}" fill="none" stroke="var(--bg-2)" stroke-width="9"/><circle cx="44" cy="44" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 44 44)"/>${tk}<text x="44" y="49" text-anchor="middle" style="font:700 15px var(--sans);fill:var(--ink)">${Math.round(p)}%</text></svg>`;
}

function viewTx() {
  const q = txFilter.q.trim().toLowerCase();

  const chips = [];

  if (q) h += `<div class="status" style="margin-top:12px">${xs.length} risultati in tutto lo storico · ${eur(sumBy(xs.filter(e => e.t === 's'), e => e.v))} di spese</div>`;
  else if (txFilter.cat || txFilter.type || P.acc || P.mode !== 'month') { const sp = sumBy(xs.filter(e => e.t === 's'), e => e.v), en = sumBy(xs.filter(e => e.t === 'e'), e => e.v); h += `<div class="status" style="margin-top:12px">${xs.length} movimenti${sp ? ` · spese ${eur(sp)}` : ''}${en ? ` · entrate ${eur(en)}` : ''}</div>`; }
  if (!xs.length) return h + '<div class="empty" style="margin-top:20px">Nessuna transazione.</div>';
  let lastDay = '', chkShown = false; const chkD = CONF.checked && CONF.checked.d;

  xs.slice(0, 400).forEach(e => {

    }

    const sub = e.t === 't' ? `${esc(e.a)} → ${esc(e.to)}` : esc(e.a);

  });

  return h;
}

async function saveTx() {
  const err = t => { const e = $('xErr'); if (e) e.textContent = t; };
  const v = S.cents / 100;
  if (!(v > 0)) return err('Digita un importo con il tastierino.');
  const t = S.t, c = t === 't' ? 'Trasferimento' : S.c;
  if (!c) return err('Scegli una categoria.');
  if (!S.a) return err('Scegli il conto.');
  if (t === 't' && (!S.to || S.to === S.a)) return err('Scegli due conti diversi.');
  const n = ($('xNote') ? $('xNote').value : S.n || '').trim();
  if (t === 's' && c === 'Abbonamenti' && S.sub && !n) return err('Scrivi il nome dell\'abbonamento nelle note: serve per riconoscerlo.');
  const doc = { d: S.d, month: S.d.slice(0, 7), t, c, a: S.a, v: Math.round(v * 100) / 100, n, created: S.created || Date.now(), source: 'app' };
  if (t === 's' && c === 'Abbonamenti' && S.sub) doc.sub = S.sub;
  if (t === 't') doc.to = S.to;
  if (S.rec) { doc.rec = S.rec; doc.genUntil = S.genUntil && S.d <= S.genUntil ? S.genUntil : S.d; }
  if (S.recOf) doc.recOf = S.recOf;
  if (S.src === 'h') doc.created = 0;
  const verb = S.edit ? 'Salvato' : 'Aggiunto', ok = $('xOk'); if (ok) ok.disabled = true;
  try {
    if (S.src === 'n') await db.doc('tx/' + S.id).set(doc);
    else { if (S.src === 'h') await dropHist(S); await db.collection('tx').add(doc); }
    closeTxe(); toast(`${verb}: ${eur(v)} · ${c}`); if (V2()) { const t = $('toast'); t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
  } catch (e) { err(e && e.code === 'quota_exceeded' ? 'Spazio esaurito.' : 'Non sono riuscito a salvare. Controlla la connessione e riprova.'); if (ok) ok.disabled = false; }
}
async function dropHist(e) { const doc = HIST[e.hm]; const tx = doc.tx.filter(x => x.i !== e.i); await db.doc('storico/' + e.hm).set({ month: e.hm, tx }); }
async function removeTx(e) {
  try { if (e.src === 'n') await db.doc('tx/' + e.id).delete(); else await dropHist(e); closeTxe(); toast('Transazione eliminata'); }
  catch (err) { const x = $('xErr'); if (x) x.textContent = 'Non sono riuscito a eliminarla: riprova.'; }
}
/* ricorrenti: crea le occorrenze mancanti fino a oggi */
let recDone = false;
async function genRecurring() {
  if (recDone || !db) return; recDone = true;
  const today = iso(now);
  for (const e of NEWS.filter(x => x.rec && !x.recOf)) {
    let last = e.genUntil || e.d, made = 0;
    const next = d => { const x = D(d); if (e.rec === 'week') x.setDate(x.getDate() + 7); else if (e.rec === 'year') x.setFullYear(x.getFullYear() + 1); else { const day = D(e.d).getDate(); const nm = new Date(x.getFullYear(), x.getMonth() + 1, 1); return iso(new Date(nm.getFullYear(), nm.getMonth(), Math.min(day, dim(nm.getFullYear(), nm.getMonth())))); } return iso(x); };
    let d = next(last);
    try {
      while (d <= today && made < 60) {
        const copy = { d, month: d.slice(0, 7), t: e.t, c: e.c, a: e.a, v: e.v, n: e.n || '', created: Date.now(), source: 'ricorrente', recOf: e.id };
        if (e.to) copy.to = e.to;
        if (e.sub) copy.sub = e.sub;
        await db.collection('tx').add(copy); last = d; made++; d = next(d);
      }
      if (made) await db.doc('tx/' + e.id).update({ genUntil: last });
    } catch (err) { /* riprova al prossimo avvio */ }
  }
}

function syncState() {

function bindSettings() {

    el.querySelectorAll('[data-ic]').forEach(b => b.onclick = () => { c.icon = b.dataset.ic; el.querySelectorAll('[data-ic]').forEach(x => x.setAttribute('aria-pressed', x === b)); prev(); });

      if (taken) return $('sErr').textContent = 'Esiste già una categoria con questo nome.';

    };

    };
  }
  if ($('sAddAcc')) $('sAddAcc').onclick = () => { SET = { view: 'accNew' }; drawSettings(); };
  if (v === 'accs') el.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => { closeSettings(); openAccount(b.dataset.acc); });
  if ($('sSaveAcc')) $('sSaveAcc').onclick = async () => {
    const name = $('aName').value.trim(), raw = $('aBal').value.replace(/\s|€/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'), v2 = raw ? parseFloat(raw) : 0;
